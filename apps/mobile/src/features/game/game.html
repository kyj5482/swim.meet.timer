<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sharks in the Water!</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#052a42;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
 * Sharks in the Water! — SplitLane easter-egg game (docs/09-sharks-game.md)
 * Single-file canvas 2D, zero dependencies. Runs in RN WebView + browser.
 * ===================================================================== */

/* ---------- config from host app ---------- */
var CFG = Object.assign(
  { stroke: 'free', distance: 50, courseUnit: 'y', character: null },
  window.GAME_CONFIG || {}
);
CFG.distance = Math.max(25, Math.min(1650, +CFG.distance || 50));

function send(obj) {
  try {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(obj));
  } catch (e) {}
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- canvas ---------- */
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  gradCache = {};
}
window.addEventListener('resize', resize);

/* ---------- helpers ---------- */
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }
function easeInOut(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function fmtTime(ms) {
  ms = Math.max(0, Math.round(ms));
  var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000);
  return m + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
}
function fitText(text, weight, px, maxW) {
  ctx.font = weight + ' ' + px + 'px system-ui,sans-serif';
  var w = ctx.measureText(text).width;
  if (w > maxW) ctx.font = weight + ' ' + Math.max(9, Math.floor(px * maxW / w)) + 'px system-ui,sans-serif';
}
var gradCache = {};
function vGrad(key, y0, y1, stops) {
  if (!gradCache[key]) {
    var g = ctx.createLinearGradient(0, y0, 0, y1);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    gradCache[key] = g;
  }
  return gradCache[key];
}

/* ---------- characters (docs/09 §5) ---------- */
var CHARACTERS = [
  { id: 'phelps',  name: 'Michael Phelps', flag: '🇺🇸', country: 'USA', gender: 'M', skin: '#e9b98b', cap: '#123a6b', suit: '#0d2b52', trait: 'Butterfly legend' },
  { id: 'thorpe',  name: 'Ian Thorpe',     flag: '🇦🇺', country: 'AUS', gender: 'M', skin: '#e3a877', cap: '#0a5c36', suit: '#083f26', trait: 'Thorpedo' },
  { id: 'sun',     name: 'Sun Yang',       flag: '🇨🇳', country: 'CHN', gender: 'M', skin: '#f0c493', cap: '#b3241c', suit: '#7d1611', trait: 'Distance free' },
  { id: 'park',    name: 'Tae-hwan Park',  flag: '🇰🇷', country: 'KOR', gender: 'M', skin: '#f2cb9a', cap: '#0f4c9a', suit: '#0a3268', trait: 'Marine Boy' },
  { id: 'hagino',  name: 'Kosuke Hagino',  flag: '🇯🇵', country: 'JPN', gender: 'M', skin: '#f0c99b', cap: '#c9303f', suit: '#8d1f2b', trait: 'IM master' },
  { id: 'ledecky', name: 'Katie Ledecky',  flag: '🇺🇸', country: 'USA', gender: 'F', skin: '#f3c8a0', cap: '#1d5fb8', suit: '#143f7d', trait: 'Freestyle queen' },
  { id: 'mckeon',  name: 'Emma McKeon',    flag: '🇦🇺', country: 'AUS', gender: 'F', skin: '#eebd92', cap: '#c99b12', suit: '#8a690a', trait: 'Sprint star' },
  { id: 'zhang',   name: 'Zhang Yufei',    flag: '🇨🇳', country: 'CHN', gender: 'F', skin: '#f5d0a4', cap: '#d43a86', suit: '#93265c', trait: 'Butterfly ace' },
  { id: 'kim',     name: 'Seo-yeong Kim',  flag: '🇰🇷', country: 'KOR', gender: 'F', skin: '#f4cf9f', cap: '#7a3fbf', suit: '#532a83', trait: 'Medley racer' },
  { id: 'ikee',    name: 'Rikako Ikee',    flag: '🇯🇵', country: 'JPN', gender: 'F', skin: '#f3cb9c', cap: '#e0596b', suit: '#9c3846', trait: 'Comeback hero' }
];
var selectedChar = CHARACTERS.find(function (c) { return c.id === CFG.character; }) || null;

var STROKE_NAME = { free: 'FREESTYLE', back: 'BACKSTROKE', breast: 'BREASTSTROKE', fly: 'BUTTERFLY', im: 'IM' };
var IM_ORDER = ['fly', 'back', 'breast', 'free'];

/* ---------- themes (docs/09 §4) ---------- */
var THEMES = [
  { id: 'reef',   name: 'Sunlit Reef',       top: '#2f9fd8', bot: '#0b4d7a', floor: '#d8c58f', accent: '#ff8f6b' },
  { id: 'kelp',   name: 'Kelp Forest',       top: '#1e8f7e', bot: '#073f45', floor: '#7c9a5e', accent: '#9be26b' },
  { id: 'wreck',  name: 'Shipwreck Cove',    top: '#2a7fae', bot: '#0a3457', floor: '#a9987b', accent: '#c9a24a' },
  { id: 'cave',   name: 'Deep Cave',         top: '#123350', bot: '#020d1c', floor: '#3c4257', accent: '#7f7fff' },
  { id: 'shallows', name: 'Treasure Shallows', top: '#41c4e8', bot: '#0e6f9e', floor: '#ecd9a0', accent: '#ffd75e' }
];
function themePlanFor(laps) {
  if (laps <= 1) return [0, 4];
  if (laps === 2) return [0, 2, 4];
  if (laps <= 4) return [0, 1, 2, 4];
  return [0, 1, 2, 3, 4];
}

/* ---------- input ---------- */
var input = {
  down: false, x0: 0, y0: 0, x: 0, y: 0, t0: 0,
  swiped: false, holdUsed: false, taps: 0
};
var onTapHandler = null, onSwipeHandler = null;
function holdDur(now) { return input.down && !input.holdUsed ? now - input.t0 : 0; }

cv.addEventListener('pointerdown', function (e) {
  input.down = true; input.swiped = false; input.holdUsed = false;
  input.x0 = input.x = e.clientX; input.y0 = input.y = e.clientY;
  input.t0 = performance.now();
});
cv.addEventListener('pointermove', function (e) {
  if (!input.down) return;
  input.x = e.clientX; input.y = e.clientY;
  var dx = input.x - input.x0, dy = input.y - input.y0;
  var TH = 26;
  if (!input.swiped && (Math.abs(dx) > TH || Math.abs(dy) > TH)) {
    input.swiped = true;
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (onSwipeHandler) onSwipeHandler(dir);
  }
});
function endPointer(e) {
  if (!input.down) return;
  var dur = performance.now() - input.t0;
  input.down = false;
  if (!input.swiped && !input.holdUsed && dur < 260 && onTapHandler) onTapHandler(input.x0, input.y0);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
window.addEventListener('keydown', function (e) {
  if (e.repeat) {
    if (e.key === ' ') e.preventDefault();
    return;
  }
  var map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.key] && onSwipeHandler) { onSwipeHandler(map[e.key]); e.preventDefault(); }
  if (e.key === 'Enter' && onTapHandler) onTapHandler(W / 2, H / 2);
  if (e.key === ' ') { // space acts as press-and-hold
    input.down = true; input.swiped = true; input.holdUsed = false;
    input.x0 = input.x = W / 2; input.y0 = input.y = H * 0.7; input.t0 = performance.now();
    e.preventDefault();
  }
});
window.addEventListener('keyup', function (e) {
  if (e.key === ' ') { input.down = false; }
});

/* ---------- particles ---------- */
var parts = [];
function bubble(x, y, opt) {
  opt = opt || {};
  parts.push({ kind: 'bubble', x: x, y: y, vx: opt.vx || rnd(-14, 14), vy: opt.vy || rnd(-70, -30),
    r: opt.r || rnd(2, 6), life: 0, max: opt.max || rnd(.7, 1.6), a: opt.a || .5 });
}
function sparkle(x, y, col) {
  parts.push({ kind: 'spark', x: x, y: y, vx: rnd(-60, 60), vy: rnd(-90, -10),
    r: rnd(2, 4), life: 0, max: rnd(.4, .8), a: 1, col: col || '#ffd75e' });
}
function splash(x, y, n) { for (var i = 0; i < n; i++) bubble(x + rnd(-40, 40), y + rnd(-20, 20), { vy: rnd(-160, -40), r: rnd(3, 9), max: rnd(.5, 1.1), a: .8 }); }
function updParts(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'spark') p.vy += 220 * dt;
    if (p.life > p.max) parts.splice(i, 1);
  }
  if (parts.length > 260) parts.splice(0, parts.length - 260);
}
function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i], t = 1 - p.life / p.max;
    ctx.globalAlpha = p.a * t;
    if (p.kind === 'bubble') {
      ctx.strokeStyle = '#cdeeff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * t, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- ambient fish ---------- */
var ambients = [];
function seedAmbients() {
  ambients = [];
  for (var i = 0; i < 14; i++) ambients.push({ x: rnd(0, 1), y: rnd(.15, .8), s: rnd(.4, 1), v: rnd(.02, .06) * (Math.random() < .5 ? 1 : -1), hue: rnd(0, 60) });
}
seedAmbients();
function drawAmbients(dt, alpha) {
  ctx.globalAlpha = alpha;
  for (var i = 0; i < ambients.length; i++) {
    var f = ambients[i];
    f.x += f.v * dt; if (f.x > 1.1) f.x = -0.1; if (f.x < -0.1) f.x = 1.1;
    var x = f.x * W, y = f.y * H, s = 6 * f.s, dir = f.v > 0 ? 1 : -1;
    ctx.fillStyle = 'hsla(' + (190 + f.hue) + ',60%,75%,.5)';
    ctx.beginPath();
    ctx.ellipse(x, y, s * 1.6, s, 0, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - dir * s * 1.6, y); ctx.lineTo(x - dir * s * 2.6, y - s * .8); ctx.lineTo(x - dir * s * 2.6, y + s * .8);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =====================================================================
 * Scenes: title → select → brief → race (+shark rock) → boss → sprint
 *         → finish → results | gameover
 * ===================================================================== */
var scene = 'title', sceneT = 0;
function setScene(s) { scene = s; sceneT = 0; onTapHandler = null; onSwipeHandler = null; enterScene(s); }

var race = null, boss = null, sprint = null, results = null, gameoverInfo = null;
var serverBoard = null; // injected via window.postResult

/* ---------- race model ---------- */
var VIEW = 42;           // yards visible ahead
var LANE_XS = 0.30;      // lane spread (fraction of W at player plane)
var DEPTH_YS = [0.50, 0.645, 0.79]; // player y (fraction of H) per depth

function projScale(dz) { var k = 7.5; return k / (dz + k); }
function proj(lane, depth, dz) {
  var s = projScale(dz);
  var hy = H * 0.34, cx = W / 2;
  return {
    x: cx + (lane - 1) * W * LANE_XS * s,
    y: hy + (DEPTH_YS[depth] * H - hy) * s,
    s: s
  };
}

function strokeAt(prog, total) {
  if (CFG.stroke !== 'im') return CFG.stroke;
  var q = clamp(Math.floor(prog / (total / 4)), 0, 3);
  return IM_ORDER[q];
}

function startRace() {
  var laps = clamp(Math.round(CFG.distance / 25), 1, 8);
  var plan = themePlanFor(laps);
  race = {
    total: CFG.distance, laps: laps, lapLen: CFG.distance / laps,
    prog: 0, prevProg: 0, elapsed: 0, bonus: 0, coins: 0,
    lane: 1, depth: 1, vLane: 1, vDepth: 1,          // logical + visual (tweened)
    baseSpeed: 6.4, speedMul: 1,
    obstacles: [], nextSpawn: 18,
    plan: plan,
    stroke: strokeAt(0, CFG.distance), strokeBanner: 0,
    shark: { state: 'none', t: 0 }, nextSharkAt: [], climbed: false, holdRing: 0,
    diveWipe: 0, count: 3.6, banner: null, bannerT: 0,
    dead: false, deadT: 0, deadBy: null,
    bossDone: false, lapFlash: 0, bank: 0
  };
  // shark events: at each theme boundary (except start), clamped inside race
  for (var i = 1; i < plan.length; i++) {
    var at = (i / plan.length) * race.total;
    if (at > 12 && at < race.total * 0.86) race.nextSharkAt.push(at);
  }
  if (!race.nextSharkAt.length) race.nextSharkAt.push(race.total * 0.45);
  setScene('race');
}

function themeIdxAt(prog) {
  var plan = race.plan;
  return plan[clamp(Math.floor(prog / (race.total / plan.length)), 0, plan.length - 1)];
}
function themeMix(prog) { // returns {a,b,t} for blending near boundaries
  var plan = race.plan, seg = race.total / plan.length;
  var i = clamp(Math.floor(prog / seg), 0, plan.length - 1);
  var local = (prog - i * seg) / seg;
  var t = local > 0.86 && i < plan.length - 1 ? (local - 0.86) / 0.14 : 0;
  return { a: THEMES[plan[i]], b: THEMES[plan[Math.min(i + 1, plan.length - 1)]], t: t };
}
function mixCol(c1, c2, t) {
  if (t <= 0) return c1;
  function h2r(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  var a = h2r(c1), b = h2r(c2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}

/* ---------- spawner ---------- */
function spawnWave(at) {
  var th = THEMES[themeIdxAt(at)].id;
  var lap = Math.floor(at / race.lapLen);
  var hard = Math.min(1, lap * 0.16);
  var r = Math.random();
  var lane = (Math.random() * 3) | 0, depth = (Math.random() * 3) | 0;

  if (th === 'wreck' && r < 0.34) { // coral gate — one open arch
    var open = (Math.random() * 3) | 0;
    race.obstacles.push({ type: 'gate', at: at, open: open });
    return 7.5;
  }
  if (th === 'wreck' || th === 'shallows') {
    if (r < 0.62) { // treasure line
      var n = 3 + ((Math.random() * 3) | 0);
      for (var i = 0; i < n; i++)
        race.obstacles.push({ type: Math.random() < .22 ? 'gem' : 'coin', at: at + i * 1.7, lane: lane, depth: depth, got: false });
      return n * 1.7 + 3.5;
    }
  }
  if (th === 'kelp' && r < 0.4) { // kelp columns block a lane at all depths
    race.obstacles.push({ type: 'kelp', at: at, lane: lane });
    return 6;
  }
  if (th === 'cave' && r < 0.35) { // urchin cluster on floor
    race.obstacles.push({ type: 'urchin', at: at, lane: lane, depth: 2 });
    if (Math.random() < .5 + hard) race.obstacles.push({ type: 'urchin', at: at + 1.2, lane: (lane + 1) % 3, depth: 2 });
    return 5.5;
  }
  if (r < 0.5) { // jellyfish (blocks cell + one above)
    race.obstacles.push({ type: 'jelly', at: at, lane: lane, depth: Math.max(1, depth) });
    if (Math.random() < 0.35 + hard) race.obstacles.push({ type: 'jelly', at: at + 1.5, lane: (lane + 2) % 3, depth: 1 });
    return 6;
  }
  if (r < 0.75) { // pufferfish
    race.obstacles.push({ type: 'puffer', at: at, lane: lane, depth: depth, ph: rnd(0, TAU) });
    return 5.5;
  }
  race.obstacles.push({ type: 'eel', at: at, lane: Math.min(lane, 1), depth: depth }); // blocks 2 adjacent lanes
  return 6.5;
}

/* ---------- collision cells ---------- */
function blockedCells(o) {
  switch (o.type) {
    case 'jelly': return [[o.lane, o.depth], [o.lane, o.depth - 1]];
    case 'puffer': return [[o.lane, o.depth]];
    case 'urchin': return [[o.lane, 2]];
    case 'kelp': return [[o.lane, 0], [o.lane, 1], [o.lane, 2]];
    case 'eel': return [[o.lane, o.depth], [o.lane + 1, o.depth]];
    case 'gate':
      var cells = [];
      for (var l = 0; l < 3; l++) if (l !== o.open) for (var d = 0; d < 3; d++) cells.push([l, d]);
      return cells;
  }
  return [];
}

/* ---------- race update ---------- */
function updateRace(dt) {
  var r = race;
  if (r.count > 0) { r.count -= dt; if (r.count <= 0) { r.banner = 'GO!'; r.bannerT = 0.8; } return; }
  if (r.dead) {
    r.deadT += dt;
    if (r.deadT > 1.4) { gameoverInfo = { by: r.deadBy, timeMs: r.elapsed * 1000, coins: r.coins }; setScene('gameover'); }
    return;
  }

  r.elapsed += dt;
  var sh = r.shark;

  /* hold: climb / dive */
  var hd = holdDur(performance.now()) / 1000;
  r.holdRing = 0;
  var holdable = (!r.climbed && (sh.state === 'alert' || sh.state === 'looming')) || (r.climbed && sh.state === 'calmed');
  if (holdable) {
    r.holdRing = clamp(hd / 1, 0, 1);
    if (hd >= 1) {
      input.holdUsed = true;
      if (!r.climbed) { // climb the rock
        r.climbed = true; sh.state = 'passing'; sh.t = 0;
        splash(W / 2, H * 0.55, 26); vibrate(30);
      } else {          // dive back in
        r.climbed = false; sh.state = 'none'; sh.t = 0; r.diveWipe = 1;
        splash(W / 2, H * 0.6, 34); vibrate(20);
      }
    }
  }

  /* shark event state machine */
  if (sh.state === 'none' && r.nextSharkAt.length && r.prog >= r.nextSharkAt[0]) {
    r.nextSharkAt.shift(); sh.state = 'looming'; sh.t = 0;
  }
  if (sh.state === 'looming') {
    sh.t += dt;
    if (sh.t > 3.6) { sh.state = 'alert'; sh.t = 0; r.banner = 'SHARKS IN THE WATER!'; r.bannerT = 2.4; vibrate([60, 60, 60]); }
  } else if (sh.state === 'alert') {
    sh.t += dt;
    if (!r.climbed && sh.t > 2.6) { killPlayer('shark'); return; }
  } else if (sh.state === 'passing') {
    sh.t += dt;
    if (sh.t > 2.6) { sh.state = 'calmed'; sh.t = 0; }
  } else if (sh.state === 'calmed') {
    sh.t += dt; // waiting for dive hold
  }
  if (r.diveWipe > 0) r.diveWipe = Math.max(0, r.diveWipe - dt * 1.4);

  if (r.climbed) { updParts(dt); return; } // time flows, no progress on the rock

  /* stroke + speed */
  r.stroke = strokeAt(r.prog, r.total);
  var lap = Math.floor(r.prog / r.lapLen) + 1;
  r.speedMul = 1 + (lap - 1) * 0.08;
  var spd = r.baseSpeed * r.speedMul * (sh.state === 'alert' ? 0.55 : 1);
  r.prevProg = r.prog;
  r.prog += spd * dt;

  /* lap banner + IM transitions */
  var newLap = Math.floor(r.prog / r.lapLen) + 1;
  if (newLap > lap && newLap <= r.laps) { r.banner = 'LAP ' + newLap + ' / ' + r.laps; r.bannerT = 1.4; r.lapFlash = 1; }
  var st2 = strokeAt(r.prog, r.total);
  if (st2 !== r.stroke) { r.banner = STROKE_NAME[st2] + '!'; r.bannerT = 1.6; splash(W / 2, H * .6, 18); r.stroke = st2; }

  /* spawn */
  if (r.prog + VIEW > r.nextSpawn && r.nextSpawn < r.total * 0.9) {
    r.nextSpawn += spawnWave(r.nextSpawn) * (1 - Math.min(.35, (lap - 1) * .07));
  }

  /* boss gate */
  if (!r.bossDone && r.coins >= 12 && r.prog >= r.total * 0.72) {
    r.bossDone = true; startBoss(); return;
  }
  /* sprint gate */
  if (r.prog >= r.total * 0.88) { startSprint(); return; }

  /* tween visual lane/depth + bank */
  var dl = r.lane - r.vLane;
  r.vLane += dl * Math.min(1, dt * 10);
  r.bank = lerp(r.bank, dl * 0.5, Math.min(1, dt * 8));
  r.vDepth += (r.depth - r.vDepth) * Math.min(1, dt * 9);

  /* collisions & pickups */
  for (var i = r.obstacles.length - 1; i >= 0; i--) {
    var o = r.obstacles[i];
    var crossed = r.prevProg < o.at && r.prog >= o.at;
    if (o.type === 'coin' || o.type === 'gem') {
      if (!o.got && crossed && o.lane === r.lane && o.depth === r.depth) {
        o.got = true; r.coins += o.type === 'gem' ? 3 : 1;
        var pp = proj(o.lane, o.depth, 0);
        for (var k = 0; k < 8; k++) sparkle(pp.x, pp.y, o.type === 'gem' ? '#7ef3ff' : '#ffd75e');
        vibrate(12);
      }
      if (o.at < r.prog - 4) r.obstacles.splice(i, 1);
      continue;
    }
    if (crossed) {
      var cells = blockedCells(o);
      for (var c = 0; c < cells.length; c++)
        if (cells[c][0] === r.lane && cells[c][1] === r.depth) { killPlayer(o.type); return; }
    }
    if (o.at < r.prog - 6) r.obstacles.splice(i, 1);
  }

  /* swim trail */
  if (Math.random() < dt * 22) {
    var p = proj(r.vLane, Math.round(r.vDepth), 0);
    bubble(p.x + rnd(-16, 16), p.y + rnd(8, 26), { a: .35 });
  }
  updParts(dt);
}

function killPlayer(by) {
  race.dead = true; race.deadT = 0; race.deadBy = by;
  vibrate([80, 40, 120]);
  var p = proj(race.vLane, Math.round(race.vDepth), 0);
  splash(p.x, p.y, 30);
}

/* ---------- boss (Shark King) ---------- */
function startBoss() {
  boss = {
    t: 0, throws: 0, maxThrows: 10, dodged: 0, hit: false, done: false,
    lane: 1, depth: 1, vLane: 1, vDepth: 1,
    target: null, telT: 0, proj: null, interval: 1.15
  };
  race.banner = 'SHARK KING!'; race.bannerT = 2;
  setScene('boss');
}
function updateBoss(dt) {
  var b = boss; b.t += dt; race.elapsed += dt;
  b.vLane += (b.lane - b.vLane) * Math.min(1, dt * 12);
  b.vDepth += (b.depth - b.vDepth) * Math.min(1, dt * 12);

  if (b.done) { if (b.t > 1.6) { setScene('race'); } return; }

  if (!b.target && !b.proj && b.throws < b.maxThrows) {
    b.target = { lane: (Math.random() * 3) | 0, depth: (Math.random() * 3) | 0 };
    b.telT = Math.max(0.34, 0.62 - b.throws * 0.03);
  } else if (b.target) {
    b.telT -= dt;
    if (b.telT <= 0) {
      b.proj = { lane: b.target.lane, depth: b.target.depth, z: 1, kind: pick(['bone', 'urchin', 'ink']) };
      b.target = null;
    }
  } else if (b.proj) {
    b.proj.z -= dt / Math.max(0.4, 0.62 - b.throws * 0.022);
    if (b.proj.z <= 0) {
      b.throws++;
      if (b.proj.lane === b.lane && b.proj.depth === b.depth) {
        b.hit = true; b.done = true; b.t = 0;
        race.banner = 'OUCH! BONUS ENDED'; race.bannerT = 1.8; vibrate(120);
      } else {
        b.dodged++; race.bonus += 0.8;
        sparkle(W / 2, H * 0.3, '#8affc1'); vibrate(15);
        if (b.throws >= b.maxThrows) {
          b.done = true; b.t = 0;
          race.banner = 'DODGED! −' + (b.dodged * 0.8).toFixed(1) + 's BONUS'; race.bannerT = 2.4;
        }
      }
      b.proj = null;
    }
  }
  updParts(dt);
}

/* ---------- sprint ---------- */
function startSprint() {
  sprint = { taps: 0, speed: 7.5, sharkGap: 7, done: false, t: 0 };
  race.banner = 'TAP! TAP! SWIM FOR IT!'; race.bannerT = 2.2;
  setScene('sprint');
}
function updateSprint(dt) {
  var s = sprint; s.t += dt; race.elapsed += dt;
  s.speed = Math.max(6, s.speed - 2.6 * dt);           // decays — keep tapping
  var mul = 1 + (race.laps - 1) * 0.04;
  race.prevProg = race.prog;
  race.prog += s.speed * mul * dt;
  var sharkSpd = 8.1 * mul;
  s.sharkGap += (s.speed * mul - sharkSpd) * dt;
  if (s.sharkGap <= 0.4) { killRaceInSprint(); return; }
  if (Math.random() < dt * 30) {
    var p = proj(1, 1, 0); bubble(p.x + rnd(-30, 30), p.y + rnd(0, 30), { a: .5, vy: rnd(-120, -60) });
  }
  if (race.prog >= race.total) { finishRace(); return; }
  updParts(dt);
}
function killRaceInSprint() {
  gameoverInfo = { by: 'shark', timeMs: race.elapsed * 1000, coins: race.coins };
  vibrate([90, 50, 140]);
  setScene('gameover');
}
function finishRace() {
  var t = Math.max(1000, Math.round((race.elapsed - race.bonus) * 1000));
  results = { timeMs: t, coins: race.coins, bonus: race.bonus, outcome: 'finish' };
  send({ type: 'result', outcome: 'finish', timeMs: t, coins: race.coins,
    stroke: CFG.stroke, distance: CFG.distance, courseUnit: CFG.courseUnit,
    character: selectedChar ? selectedChar.id : null });
  setScene('finish');
}

/* ---------- scene entry ---------- */
function enterScene(s) {
  if (s === 'title') {
    onTapHandler = function () { setScene('select'); };
  } else if (s === 'select') {
    onTapHandler = selectTap;
  } else if (s === 'brief') {
    onTapHandler = function () { startRace(); };
  } else if (s === 'race') {
    onSwipeHandler = function (dir) {
      if (race.dead || race.climbed || race.count > 0) return;
      if (dir === 'left') race.lane = clamp(race.lane - 1, 0, 2);
      if (dir === 'right') race.lane = clamp(race.lane + 1, 0, 2);
      if (dir === 'up') race.depth = clamp(race.depth - 1, 0, 2);
      if (dir === 'down') race.depth = clamp(race.depth + 1, 0, 2);
    };
  } else if (s === 'boss') {
    onSwipeHandler = function (dir) {
      if (boss.done) return;
      if (dir === 'left') boss.lane = clamp(boss.lane - 1, 0, 2);
      if (dir === 'right') boss.lane = clamp(boss.lane + 1, 0, 2);
      if (dir === 'up') boss.depth = clamp(boss.depth - 1, 0, 2);
      if (dir === 'down') boss.depth = clamp(boss.depth + 1, 0, 2);
    };
  } else if (s === 'sprint') {
    onTapHandler = function () {
      sprint.speed = Math.min(13, sprint.speed + 1.15); sprint.taps++;
      var p = proj(1, 1, 0); splash(p.x, p.y + 10, 3);
    };
  } else if (s === 'finish') {
    setTimeout(function () { if (scene === 'finish') setScene('results'); }, 2600);
  } else if (s === 'gameover') {
    send({ type: 'result', outcome: 'gameover', by: gameoverInfo.by, timeMs: Math.round(gameoverInfo.timeMs),
      coins: gameoverInfo.coins, stroke: CFG.stroke, distance: CFG.distance,
      courseUnit: CFG.courseUnit, character: selectedChar ? selectedChar.id : null });
    setTimeout(function () {
      if (scene !== 'gameover') return;
      onTapHandler = gameEndTap;
    }, 700);
  } else if (s === 'results') {
    onTapHandler = gameEndTap;
  }
}
function gameEndTap(x, y) {
  // bottom buttons: retry (left) / exit (right)
  if (y > H - 120) {
    if (x < W / 2) { parts = []; startRace(); }
    else send({ type: 'exit' });
  }
}

/* ---------- character select ---------- */
function selectGrid() {
  var cols = W > H ? 5 : 2, rows = Math.ceil(10 / cols);
  var pad = 12, topY = H * 0.16, botY = H - 96;
  var cw = (W - pad * (cols + 1)) / cols, ch = (botY - topY - pad * rows) / rows;
  return { cols: cols, rows: rows, pad: pad, topY: topY, cw: cw, ch: Math.min(ch, 190) };
}
function selectTap(x, y) {
  var g = selectGrid();
  for (var i = 0; i < CHARACTERS.length; i++) {
    var col = i % g.cols, row = (i / g.cols) | 0;
    var cx = g.pad + col * (g.cw + g.pad), cy = g.topY + row * (g.ch + g.pad);
    if (x >= cx && x <= cx + g.cw && y >= cy && y <= cy + g.ch) { selectedChar = CHARACTERS[i]; vibrate(10); return; }
  }
  if (selectedChar && y > H - 88 && Math.abs(x - W / 2) < 130) setScene('brief');
}

/* =====================================================================
 * Rendering
 * ===================================================================== */
var lastTs = 0;
function loop(ts) {
  var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts; sceneT += dt;

  if (scene === 'race') updateRace(dt);
  else if (scene === 'boss') updateBoss(dt);
  else if (scene === 'sprint') updateSprint(dt);
  else updParts(dt);

  render(dt);
  requestAnimationFrame(loop);
}

function render(dt) {
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') drawTitle();
  else if (scene === 'select') drawSelect();
  else if (scene === 'brief') drawBrief();
  else if (scene === 'race') drawRace(dt);
  else if (scene === 'boss') drawBoss(dt);
  else if (scene === 'sprint') drawSprint(dt);
  else if (scene === 'finish') drawFinish();
  else if (scene === 'gameover') drawGameover();
  else if (scene === 'results') drawResults();
}

/* ---------- water background ---------- */
function drawWater(top, bot, floorCol, floorY) {
  ctx.fillStyle = vGrad('w' + top + bot, 0, H, [[0, top], [1, bot]]);
  ctx.fillRect(0, 0, W, H);
  // light rays
  ctx.save(); ctx.globalAlpha = 0.10;
  for (var i = 0; i < 4; i++) {
    var x = ((sceneT * 12 + i * W / 3.2) % (W + 300)) - 150;
    ctx.fillStyle = '#dff6ff';
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 90, 0); ctx.lineTo(x - 60, H); ctx.lineTo(x - 150, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  if (floorY != null) {
    ctx.fillStyle = floorCol;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, floorY + 14);
    ctx.quadraticCurveTo(W * 0.3, floorY - 8, W * 0.55, floorY + 6);
    ctx.quadraticCurveTo(W * 0.8, floorY + 16, W, floorY);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
}

/* ---------- swimmer (rear view) ---------- */
function drawSwimmer(x, y, s, stroke, phase, ch, opts) {
  ch = ch || CHARACTERS[0]; opts = opts || {};
  var sz = 46 * s * (opts.scale || 1);
  ctx.save();
  ctx.translate(x, y);
  if (opts.bank) ctx.rotate(opts.bank * 0.4);
  var onBack = stroke === 'back';
  var bob = Math.sin(phase * (stroke === 'fly' || stroke === 'breast' ? 1 : 2)) * sz * (stroke === 'fly' ? 0.14 : 0.05);
  ctx.translate(0, bob);

  // legs / kick (toward camera = below)
  ctx.strokeStyle = ch.skin; ctx.lineCap = 'round';
  ctx.lineWidth = sz * 0.24;
  if (stroke === 'fly') {
    var k = Math.sin(phase) * sz * 0.35;
    ctx.beginPath(); ctx.moveTo(-sz * 0.14, sz * 0.55); ctx.quadraticCurveTo(-sz * 0.14, sz * 0.95, -sz * 0.12 + k * 0.2, sz * 1.25 + k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sz * 0.14, sz * 0.55); ctx.quadraticCurveTo(sz * 0.14, sz * 0.95, sz * 0.12 + k * 0.2, sz * 1.25 + k); ctx.stroke();
  } else if (stroke === 'breast') {
    var fr = Math.sin(phase) * 0.5 + 0.5; // frog kick spread
    ctx.beginPath(); ctx.moveTo(-sz * 0.14, sz * 0.55); ctx.lineTo(-sz * (0.2 + fr * 0.45), sz * 1.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sz * 0.14, sz * 0.55); ctx.lineTo(sz * (0.2 + fr * 0.45), sz * 1.15); ctx.stroke();
  } else {
    var ka = Math.sin(phase * 2) * sz * 0.3, kb = -ka;
    ctx.beginPath(); ctx.moveTo(-sz * 0.14, sz * 0.55); ctx.lineTo(-sz * 0.16, sz * 1.2 + ka * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sz * 0.14, sz * 0.55); ctx.lineTo(sz * 0.16, sz * 1.2 + kb * 0.4); ctx.stroke();
  }

  // torso (swimsuit)
  ctx.fillStyle = ch.suit;
  ctx.beginPath();
  ctx.moveTo(-sz * 0.42, -sz * 0.12);
  ctx.quadraticCurveTo(0, -sz * 0.3, sz * 0.42, -sz * 0.12);
  ctx.lineTo(sz * 0.26, sz * 0.66);
  ctx.quadraticCurveTo(0, sz * 0.82, -sz * 0.26, sz * 0.66);
  ctx.closePath(); ctx.fill();

  // arms
  function arm(side, a) { // side -1/1, a = stroke angle 0..1 cycle
    var sx = side * sz * 0.4, sy = -sz * 0.1;
    var reach = sz * (0.75 + 0.2 * Math.sin(a * TAU));
    var ang;
    if (stroke === 'fly') ang = -1.9 + Math.sin(a * TAU) * 1.5;
    else if (stroke === 'breast') ang = -0.5 - (Math.sin(a * TAU) * .5 + .5) * 1.4;
    else ang = -1.9 + Math.sin(a * TAU) * 1.7;
    var hx = sx + side * Math.cos(ang) * reach * -1, hy = sy + Math.sin(ang) * reach;
    ctx.strokeStyle = ch.skin; ctx.lineWidth = sz * 0.2;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx + side * sz * 0.5, sy - sz * 0.3, hx, hy);
    ctx.stroke();
    if (Math.sin(a * TAU) > 0.7) splashMaybe(x + hx, y + hy);
  }
  var sync = stroke === 'fly' || stroke === 'breast';
  arm(-1, phase / TAU);
  arm(1, sync ? phase / TAU : phase / TAU + 0.5);

  // head + cap (or face when backstroke)
  var hy2 = -sz * 0.42;
  ctx.fillStyle = ch.skin;
  ctx.beginPath(); ctx.arc(0, hy2, sz * 0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.cap;
  ctx.beginPath(); ctx.arc(0, hy2 - sz * 0.03, sz * 0.29, Math.PI, 0); ctx.fill();
  ctx.fillRect(-sz * 0.29, hy2 - sz * 0.05, sz * 0.58, sz * 0.08);
  if (onBack) { // goggles facing up
    ctx.fillStyle = '#183048';
    ctx.beginPath(); ctx.ellipse(-sz * 0.1, hy2 + sz * 0.06, sz * 0.09, sz * 0.06, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sz * 0.1, hy2 + sz * 0.06, sz * 0.09, sz * 0.06, 0, 0, TAU); ctx.fill();
  } else { // goggle strap
    ctx.strokeStyle = '#183048'; ctx.lineWidth = sz * 0.06;
    ctx.beginPath(); ctx.moveTo(-sz * 0.28, hy2); ctx.lineTo(sz * 0.28, hy2); ctx.stroke();
  }
  ctx.restore();
}
var splashCooldown = 0;
function splashMaybe(x, y) {
  if (performance.now() - splashCooldown < 120) return;
  splashCooldown = performance.now();
  bubble(x, y, { a: .4, r: rnd(2, 4) });
}

/* ---------- creatures / obstacles ---------- */
function drawJelly(x, y, s, t) {
  var r = 30 * s;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 6 * s);
  ctx.fillStyle = 'rgba(255,92,180,.85)';
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0);
  ctx.quadraticCurveTo(r, r * 0.4, r * 0.8, r * 0.42);
  ctx.lineTo(-r * 0.8, r * 0.42);
  ctx.quadraticCurveTo(-r, r * 0.4, -r, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,60,160,.8)'; ctx.lineWidth = Math.max(1, 3.5 * s); ctx.lineCap = 'round';
  for (var i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * r * 0.3, r * 0.42);
    ctx.quadraticCurveTo(i * r * 0.3 + Math.sin(t * 3 + i) * 8 * s, r * 1.1, i * r * 0.3 + Math.sin(t * 3 + i + 1) * 10 * s, r * 1.7);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPuffer(x, y, s, t) {
  var r = (24 + Math.sin(t * 4) * 4) * s;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#e8c25a';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#a8842a'; ctx.lineWidth = Math.max(1, 2 * s);
  for (var i = 0; i < 10; i++) {
    var a = i / 10 * TAU;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3); ctx.stroke();
  }
  ctx.fillStyle = '#1b2b38';
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.2, r * 0.12, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.2, r * 0.12, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawUrchin(x, y, s, t) {
  var r = 22 * s;
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#2b1e3f'; ctx.lineWidth = Math.max(1, 2.4 * s);
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * TAU + t * 0.2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 1.6, Math.sin(a) * r * 1.6); ctx.stroke();
  }
  ctx.fillStyle = '#463063';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawEel(x, y, s, t, w) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#3f7d4e'; ctx.lineWidth = 18 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i <= 10; i++) {
    var px = -w / 2 + w * i / 10, py = Math.sin(t * 4 + i * 0.9) * 10 * s;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(w / 2, Math.sin(t * 4 + 9) * 10 * s, 11 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1c2b33';
  ctx.beginPath(); ctx.arc(w / 2 + 3 * s, Math.sin(t * 4 + 9) * 10 * s - 3 * s, 3 * s, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawKelpCol(x, yTop, yBot, s, t) {
  ctx.strokeStyle = '#2f7d3f'; ctx.lineWidth = 12 * s; ctx.lineCap = 'round';
  for (var j = -1; j <= 1; j++) {
    ctx.beginPath();
    for (var i = 0; i <= 8; i++) {
      var yy = lerp(yBot, yTop, i / 8);
      var xx = x + j * 14 * s + Math.sin(t * 1.6 + i * 0.7 + j) * 12 * s * (i / 8);
      i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }
}
function drawGate(o, t) {
  // three arches at o.at — open one glows, blocked ones have tentacles
  for (var l = 0; l < 3; l++) {
    var top = proj(l, 0, o.at - race.prog), bot = proj(l, 2, o.at - race.prog);
    var s = top.s, w = 60 * s;
    var open = l === o.open;
    ctx.strokeStyle = open ? THEMES[2].accent : '#7d6a52';
    ctx.lineWidth = 16 * s;
    ctx.beginPath();
    ctx.moveTo(top.x - w, bot.y + 20 * s);
    ctx.lineTo(top.x - w, top.y);
    ctx.quadraticCurveTo(top.x, top.y - 60 * s, top.x + w, top.y);
    ctx.lineTo(top.x + w, bot.y + 20 * s);
    ctx.stroke();

      ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(t * 5) * 0.2;
      ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 4 * s;
      ctx.beginPath(); ctx.arc(top.x, (top.y + bot.y) / 2, w * 0.75, 0, TAU); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(150,70,160,.9)'; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(top.x + k * w * 0.4, top.y - 10 * s);
        ctx.quadraticCurveTo(top.x + k * w * 0.55 + Math.sin(t * 2 + k) * 10 * s, (top.y + bot.y) / 2, top.x + k * w * 0.3, bot.y);
        ctx.stroke();
        // suckers
        ctx.fillStyle = 'rgba(220,160,230,.9)';
        ctx.beginPath(); ctx.arc(top.x + k * w * 0.45, (top.y + bot.y) / 2, 3.4 * s, 0, TAU); ctx.fill();
      }
    }
  }
}
function drawCoin(x, y, s, t, gem) {
  ctx.save(); ctx.translate(x, y);
  var w = Math.abs(Math.sin(t * 3.5)) * 0.7 + 0.3;
  if (gem) {
    ctx.fillStyle = '#59e6ff';
    ctx.beginPath();
    ctx.moveTo(0, -16 * s); ctx.lineTo(13 * s * w, 0); ctx.lineTo(0, 16 * s); ctx.lineTo(-13 * s * w, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#bff5ff'; ctx.lineWidth = 2 * s; ctx.stroke();
  } else {
    ctx.fillStyle = '#ffcf4d';
    ctx.beginPath(); ctx.ellipse(0, 0, 13 * s * w, 13 * s, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8781c'; ctx.lineWidth = 2.5 * s; ctx.stroke();
  }

}
function drawShark(x, y, s, opts) {
  opts = opts || {};
  ctx.save(); ctx.translate(x, y);
  if (opts.flip) ctx.scale(-1, 1);
  ctx.globalAlpha = opts.alpha != null ? opts.alpha : 1;
  var L = 130 * s;
  var col = opts.blur ? 'rgba(20,45,66,' + (0.25 + 0.5 * (opts.sharp || 0)) + ')' : '#22434f';
  // soft silhouette when far (blur substitute: layered alpha)
  if (opts.blur) {
    for (var i = 3; i >= 1; i--) {
      ctx.globalAlpha = 0.1 * (opts.alpha || 1);
      sharkPath(L * (1 + i * 0.06)); ctx.fillStyle = col; ctx.fill();
    }
    ctx.globalAlpha = (0.35 + 0.55 * (opts.sharp || 0)) * (opts.alpha || 1);
  }
  sharkPath(L); ctx.fillStyle = col; ctx.fill();
  if (!opts.blur) { // details
    ctx.fillStyle = '#dfeef2';
    ctx.beginPath(); ctx.ellipse(L * 0.18, L * 0.09, L * 0.32, L * 0.1, -0.08, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0e2530';
    ctx.beginPath(); ctx.arc(L * 0.4, -L * 0.05, L * 0.028, 0, TAU); ctx.fill();
    // gills + teeth
    ctx.strokeStyle = '#16323c'; ctx.lineWidth = L * 0.015;
    for (var g = 0; g < 3; g++) {
      ctx.beginPath(); ctx.arc(L * (0.22 + g * 0.035), 0, L * 0.07, -1, 1); ctx.stroke();
    }
    if (opts.teeth) {
      ctx.fillStyle = '#fff';
      for (var tt = 0; tt < 5; tt++) {
        ctx.beginPath();
        var tx = L * (0.34 + tt * 0.03);
        ctx.moveTo(tx, L * 0.08); ctx.lineTo(tx + L * 0.012, L * 0.13); ctx.lineTo(tx + L * 0.024, L * 0.08);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  ctx.restore();
}
function sharkPath(L) {
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, 0);
  ctx.quadraticCurveTo(-L * 0.2, -L * 0.16, L * 0.15, -L * 0.13);   // back
  ctx.quadraticCurveTo(L * 0.38, -L * 0.1, L * 0.5, 0);             // nose
  ctx.quadraticCurveTo(L * 0.3, L * 0.14, -L * 0.1, L * 0.12);      // belly
  ctx.quadraticCurveTo(-L * 0.3, L * 0.1, -L * 0.5, 0);
  // tail
  ctx.moveTo(-L * 0.48, 0);
  ctx.lineTo(-L * 0.62, -L * 0.18); ctx.lineTo(-L * 0.52, 0); ctx.lineTo(-L * 0.62, L * 0.14);
  ctx.closePath();
  // dorsal fin
  ctx.moveTo(L * 0.02, -L * 0.12);
  ctx.lineTo(L * 0.08, -L * 0.3); ctx.lineTo(L * 0.18, -L * 0.12);
  ctx.closePath();
}
function drawFin(x, y, s) {
  ctx.fillStyle = '#22434f';
  ctx.beginPath();
  ctx.moveTo(x - 18 * s, y); ctx.quadraticCurveTo(x - 4 * s, y - 30 * s, x + 12 * s, y - 26 * s);
  ctx.quadraticCurveTo(x + 6 * s, y - 10 * s, x + 16 * s, y);
  ctx.closePath(); ctx.fill();
  // wake
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 26 * s, y + 2); ctx.quadraticCurveTo(x, y + 8 * s, x + 24 * s, y + 2); ctx.stroke();
}
function drawIsland(x, y, s) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#e8d59a';
  ctx.beginPath(); ctx.ellipse(0, 0, 90 * s, 26 * s, 0, 0, TAU); ctx.fill();
  // palm
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20 * s, 0); ctx.quadraticCurveTo(-26 * s, -40 * s, -10 * s, -62 * s); ctx.stroke();
  ctx.strokeStyle = '#2f9d4e'; ctx.lineWidth = 5 * s;
  for (var i = 0; i < 5; i++) {
    var a = -0.4 - i * 0.5;
    ctx.beginPath(); ctx.moveTo(-10 * s, -62 * s);
    ctx.quadraticCurveTo(-10 * s + Math.cos(a) * 30 * s, -62 * s + Math.sin(a) * 26 * s, -10 * s + Math.cos(a) * 44 * s, -62 * s + Math.sin(a) * 20 * s + 8 * s);
    ctx.stroke();
  }
  // chest
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(8 * s, -22 * s, 34 * s, 22 * s);
  ctx.fillStyle = '#6d4520'; ctx.fillRect(8 * s, -22 * s, 34 * s, 8 * s);
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath(); ctx.arc(25 * s, -12 * s, 5 * s, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawRock(x, y, s) {
  ctx.fillStyle = '#6b6154';
  ctx.beginPath();
  ctx.moveTo(x - 90 * s, y + 30 * s);
  ctx.quadraticCurveTo(x - 70 * s, y - 55 * s, x - 10 * s, y - 62 * s);
  ctx.quadraticCurveTo(x + 60 * s, y - 58 * s, x + 88 * s, y + 30 * s);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(x - 20 * s, y - 20 * s, 16 * s, 9 * s, 0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 30 * s, y - 5 * s, 12 * s, 7 * s, -0.3, 0, TAU); ctx.fill();
}

/* ---------- theme decorations (parallax at side lanes) ---------- */
function drawThemeDecor(themeA, t) {
  var id = themeA.id;
  var floorY = H * 0.82;
  if (id === 'reef') {
    for (var i = 0; i < 5; i++) {
      var x = (i / 5 + 0.08) * W + Math.sin(i * 7) * 20;
      ctx.fillStyle = i % 2 ? '#ff8f6b' : '#e75f8f';
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      for (var b = 0; b < 4; b++) ctx.arc(x + b * 8 - 12, floorY + 6 - b * 10, 9, 0, TAU);
      ctx.fill(); ctx.globalAlpha = 1;
    }
  } else if (id === 'kelp') {
    // 장식 켈프는 플레이 영역 밖(좌우 가장자리)에만 — 장애물 켈프와 혼동 방지
    var kx = [0.03, 0.09, 0.15, 0.85, 0.91, 0.97];
    for (var k = 0; k < kx.length; k++) drawKelpCol(kx[k] * W, H * 0.28, floorY + 12, 0.7, t + k);
  } else if (id === 'wreck') {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#3a2f24';
    ctx.beginPath();
    ctx.moveTo(W * 0.06, floorY + 10); ctx.lineTo(W * 0.13, H * 0.5); ctx.lineTo(W * 0.2, floorY + 10);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(W * 0.75, H * 0.62, W * 0.2, 12);
    ctx.fillRect(W * 0.8, H * 0.52, 10, H * 0.3);
    ctx.restore();
  } else if (id === 'cave') {
    ctx.fillStyle = 'rgba(6,10,26,.55)';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W * 0.22, 0); ctx.quadraticCurveTo(W * 0.06, H * 0.5, W * 0.18, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W, 0); ctx.lineTo(W * 0.78, 0); ctx.quadraticCurveTo(W * 0.94, H * 0.5, W * 0.82, H); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
  } else if (id === 'shallows') {
    ctx.globalAlpha = 0.5;
    for (var st = 0; st < 7; st++) {
      var sx = (st / 7 + 0.06) * W, sy = floorY + 8 + (st % 3) * 8;
      ctx.fillStyle = '#f2b880';
      ctx.save(); ctx.translate(sx, sy);
      for (var p5 = 0; p5 < 5; p5++) { ctx.rotate(TAU / 5); ctx.fillRect(-2, -9, 4, 9); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- HUD ---------- */
function drawHUD() {
  var r = race;
  var lap = clamp(Math.floor(r.prog / r.lapLen) + 1, 1, r.laps);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  // lap chip
  chip(12, 12, 'LAP ' + lap + '/' + r.laps, r.lapFlash > 0 ? '#ffd75e' : 'rgba(4,26,40,.55)');
  r.lapFlash = Math.max(0, r.lapFlash - 0.02);
  // stroke chip
  chip(12, 48, STROKE_NAME[r.stroke], 'rgba(4,26,40,.55)');
  // time — top center
  ctx.font = '800 ' + Math.min(34, W * 0.07) + 'px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(4,26,40,.55)';
  var tw = ctx.measureText('8:88.88').width + 26;
  roundRect(W / 2 - tw / 2, 10, tw, 42, 12); ctx.fill();
  ctx.fillStyle = '#eaf7ff';
  ctx.fillText(fmtTime((r.elapsed - r.bonus) * 1000), W / 2, 18);
  // coins — top right
  ctx.textAlign = 'right'; ctx.font = '800 18px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(4,26,40,.55)';
  roundRect(W - 112, 12, 100, 30, 10); ctx.fill();
  drawCoin(W - 94, 27, 0.9, sceneT, false);
  ctx.fillStyle = '#ffe9ad'; ctx.fillText(String(r.coins), W - 22, 18);
  // progress bar
  var bw = W - 48, bx = 24, by = H - 26;
  ctx.fillStyle = 'rgba(4,26,40,.5)'; roundRect(bx, by, bw, 10, 5); ctx.fill();
  ctx.fillStyle = '#5fd6ff'; roundRect(bx, by, bw * clamp(r.prog / r.total, 0, 1), 10, 5); ctx.fill();
  drawIsland(bx + bw - 4, by - 6, 0.24);
  drawSwimmerDot(bx + bw * clamp(r.prog / r.total, 0, 1), by + 5);
  ctx.textAlign = 'left';
  ctx.font = '700 12px system-ui,sans-serif'; ctx.fillStyle = '#bfe9ff';
  ctx.fillText(CFG.distance + ' ' + (CFG.courseUnit === 'y' ? 'yd' : 'm') + ' to treasure', bx, by - 18);
}
function drawSwimmerDot(x, y) {
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#04364e'; ctx.lineWidth = 2; ctx.stroke();
}
function chip(x, y, text, bg) {
  ctx.font = '800 15px system-ui,sans-serif';
  var w = ctx.measureText(text).width + 20;
  ctx.fillStyle = bg; roundRect(x, y, w, 28, 9); ctx.fill();
  ctx.fillStyle = '#eaf7ff'; ctx.textAlign = 'left'; ctx.fillText(text, x + 10, y + 7);
  return w;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function banner(text, alpha, col) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = '900 ' + Math.min(44, W * 0.085) + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(4,26,40,.85)';
  ctx.strokeText(text, W / 2, H * 0.3);
  ctx.fillStyle = col || '#ffd75e';
  ctx.fillText(text, W / 2, H * 0.3);
  ctx.restore();
}
function bigButton(x, y, w, text, primary) {
  roundRect(x, y, w, 54, 16);
  ctx.fillStyle = primary ? '#37c0ff' : 'rgba(230,245,255,.14)'; ctx.fill();
  ctx.font = '800 19px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = primary ? '#03283d' : '#d9f1ff';
  ctx.fillText(text, x + w / 2, y + 28);
}

/* ---------- race render ---------- */
function drawRace(dt) {
  var r = race, mix = themeMix(r.prog);
  var top = mixCol(mix.a.top, mix.b.top, mix.t), bot = mixCol(mix.a.bot, mix.b.bot, mix.t);
  var floorCol = mixCol(mix.a.floor, mix.b.floor, mix.t);

  if (r.climbed || r.shark.state === 'passing' || (r.climbed && r.shark.state === 'calmed')) {
    drawRockScene(dt); return;
  }

  drawWater(top, bot, floorCol, H * 0.82);
  drawAmbients(dt, 0.5);
  drawThemeDecor(mix.a, sceneT);

  // island at horizon grows near the end
  var isl = clamp((r.prog / r.total - 0.55) / 0.45, 0, 1);
  if (isl > 0) drawIsland(W / 2, H * 0.335, 0.25 + isl * 0.9);

  // obstacles back-to-front
  var obs = r.obstacles.slice().sort(function (a, b) { return b.at - a.at; });
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i], dz = o.at - r.prog;
    if (dz < -2 || dz > VIEW) continue;
    if (o.type === 'gate') { drawGate(o, sceneT); continue; }
    if (o.type === 'kelp') {
      var pt = proj(o.lane, 0, dz), pb = proj(o.lane, 2, dz);
      drawKelpCol(pt.x, pt.y - 30 * pt.s, pb.y + 26 * pb.s, pt.s * 1.5, sceneT);
      continue;
    }
    var p = proj(o.lane, o.depth == null ? 1 : o.depth, dz);
    if (o.type === 'jelly') drawJelly(p.x, p.y, p.s, sceneT + o.at);
    else if (o.type === 'puffer') drawPuffer(p.x + Math.sin(sceneT * 2 + o.ph) * 14 * p.s * clamp((dz - 5) / 10, 0, 1), p.y, p.s, sceneT + o.at);
    else if (o.type === 'urchin') drawUrchin(p.x, p.y + 8 * p.s, p.s, sceneT);
    else if (o.type === 'eel') drawEel((proj(o.lane, o.depth, dz).x + proj(o.lane + 1, o.depth, dz).x) / 2, p.y, p.s, sceneT + o.at, Math.abs(proj(o.lane + 1, o.depth, dz).x - proj(o.lane, o.depth, dz).x) + 40 * p.s);
    else if ((o.type === 'coin' || o.type === 'gem') && !o.got) drawCoin(p.x, p.y, p.s, sceneT + o.at, o.type === 'gem');
  }

  // looming / alert shark
  var sh = r.shark;
  if (sh.state === 'looming') {
    var lt = clamp(sh.t / 3.6, 0, 1);
    var sp = proj(0.1, 1, lerp(38, 14, lt));
    drawShark(sp.x, sp.y, sp.s * 1.6, { blur: true, sharp: lt * 0.7, alpha: 0.9, flip: true });
  } else if (sh.state === 'alert') {
    var at = clamp(sh.t / 2.6, 0, 1);
    var ap = proj(lerp(0, 1, at), 1, lerp(13, 1.5, at));
    drawShark(ap.x, ap.y, ap.s * 1.7, { teeth: at > 0.5, flip: true });
    // red vignette
    ctx.save(); ctx.globalAlpha = 0.24 + Math.sin(sceneT * 10) * 0.1;
    ctx.fillStyle = vGrad('alert', 0, H, [[0, 'rgba(255,40,40,.0)'], [1, 'rgba(255,30,30,.7)']]);
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }

  // cave light cone
  if (mix.a.id === 'cave') {
    var pp2 = proj(r.vLane, Math.round(r.vDepth), 0);
    ctx.save();
    var g = ctx.createRadialGradient(pp2.x, pp2.y - 40, 60, pp2.x, pp2.y - 40, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(2,8,20,0)'); g.addColorStop(1, 'rgba(2,8,20,.82)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // player
  var pp = proj(r.vLane, 0, 0);
  var py = lerp(DEPTH_YS[0], DEPTH_YS[2], r.vDepth / 2) * H;
  var phase = sceneT * (r.stroke === 'breast' ? 4.6 : 6.2);
  if (!r.dead) drawSwimmer(pp.x, py, 1, r.stroke, phase, selectedChar, { bank: r.bank });
  else {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - r.deadT);
    drawSwimmer(pp.x, py + r.deadT * 60, 1, r.stroke, 0, selectedChar, { bank: r.deadT * 2 });
    ctx.restore();
  }
  drawParts();

  // hold ring
  if (r.holdRing > 0) drawHoldRing(r.holdRing, r.climbed ? 'DIVE!' : 'CLIMB!');

  // countdown
  if (r.count > 0) {
    var n = Math.ceil(r.count - 0.6);
    banner(n > 0 ? String(n) : 'GO!', 1, '#8affc1');
    ctx.font = '700 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#d9f1ff';
    ctx.fillText('Swipe ⟵ ⟶ ↑ ↓ to swim · hold 1s to climb when sharks come!', W / 2, H * 0.42);
  }
  // banner
  if (r.bannerT > 0) { r.bannerT -= dt; banner(r.banner, clamp(r.bannerT, 0, 1), r.banner && r.banner.indexOf('SHARK') >= 0 ? '#ff6b5e' : '#ffd75e'); }

  // dive wipe (bubbles curtain)
  if (r.diveWipe > 0) drawBubbleWipe(1 - r.diveWipe);
  if (r.dead) { ctx.fillStyle = 'rgba(255,40,40,' + Math.max(0, .4 - r.deadT * .3) + ')'; ctx.fillRect(0, 0, W, H); }

  drawHUD();
}
function drawHoldRing(t, label) {
  var x = input.down ? input.x : W / 2, y = input.down ? input.y - 70 : H * 0.5;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(x, y, 34, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#ffd75e';
  ctx.beginPath(); ctx.arc(x, y, 34, -Math.PI / 2, -Math.PI / 2 + t * TAU); ctx.stroke();
  ctx.font = '800 14px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe9ad'; ctx.fillText(label, x, y + 56);
  ctx.restore();
}
function drawBubbleWipe(t) {
  // t 0→1 curtain rises
  ctx.save();
  var yy = H * (1 - t * 1.3);
  for (var i = 0; i < 40; i++) {
    var bx = (i / 40) * W + Math.sin(i * 13.3) * 14;
    var by = yy + Math.sin(i * 7.7) * 60 + 40;
    var br = 14 + Math.abs(Math.sin(i * 3)) * 26;
    ctx.fillStyle = 'rgba(214,240,255,.85)';
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(214,240,255,.92)';
  ctx.fillRect(0, yy + 60, W, H);
  ctx.restore();
}

/* ---------- rock scene (climbed) ---------- */
function drawRockScene(dt) {
  var r = race, sh = r.shark;
  // above water: sky + sea
  ctx.fillStyle = vGrad('sky', 0, H * 0.5, [[0, '#8fd8ff'], [1, '#d8f2ff']]);
  ctx.fillRect(0, 0, W, H * 0.5);
  ctx.fillStyle = vGrad('sea', H * 0.5, H, [[0, '#2f9fd8'], [1, '#0b4d7a']]);
  ctx.fillRect(0, H * 0.5, W, H * 0.5);
  // waves
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  for (var i = 0; i < 3; i++) {
    ctx.beginPath();
    for (var x = 0; x <= W; x += 14)
      ctx.lineTo(x, H * 0.5 + 6 + i * 26 + Math.sin(x / 46 + sceneT * 2 + i) * 4);
    ctx.stroke();
  }
  // distant island
  drawIsland(W * 0.82, H * 0.47, 0.5);
  // rock + player standing
  drawRock(W / 2, H * 0.62, 1.1);
  drawStanding(W / 2, H * 0.47, 1, selectedChar);
  // circling fins
  var n = sh.state === 'passing' ? 3 : sh.state === 'calmed' && sh.t < 1.4 ? 2 : 0;
  for (var f = 0; f < n; f++) {
    var a = sceneT * 1.4 + f * 2.1;
    drawFin(W / 2 + Math.cos(a) * W * 0.3, H * 0.62 + Math.sin(a) * 26 + 30, 1);
  }
  if (sh.state === 'calmed' && sh.t >= 1.2) {
    ctx.font = '800 20px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#04364e';
    ctx.fillText('Coast is clear — hold 1s to dive back in!', W / 2, H * 0.16);
  } else {
    ctx.font = '800 20px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#a33';
    ctx.fillText('Whew! Wait for the sharks to pass…', W / 2, H * 0.16);
  }
  if (r.holdRing > 0) drawHoldRing(r.holdRing, 'DIVE!');
  drawParts();
  drawHUD();
}
function drawStanding(x, y, s, ch) {
  ch = ch || CHARACTERS[0];
  var sz = 40 * s;
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = ch.skin; ctx.lineCap = 'round'; ctx.lineWidth = sz * 0.22;
  // legs
  ctx.beginPath(); ctx.moveTo(-sz * 0.14, sz * 0.5); ctx.lineTo(-sz * 0.2, sz * 1.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sz * 0.14, sz * 0.5); ctx.lineTo(sz * 0.2, sz * 1.1); ctx.stroke();
  // body
  ctx.fillStyle = ch.suit;
  roundRectAt(-sz * 0.34, -sz * 0.2, sz * 0.68, sz * 0.78, sz * 0.2); ctx.fill();
  // arms up (phew!)
  ctx.beginPath(); ctx.moveTo(-sz * 0.34, -sz * 0.05); ctx.lineTo(-sz * 0.7, -sz * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sz * 0.34, -sz * 0.05); ctx.lineTo(sz * 0.7, -sz * 0.6); ctx.stroke();
  // head
  ctx.fillStyle = ch.skin; ctx.beginPath(); ctx.arc(0, -sz * 0.52, sz * 0.28, 0, TAU); ctx.fill();
  ctx.fillStyle = ch.cap; ctx.beginPath(); ctx.arc(0, -sz * 0.56, sz * 0.27, Math.PI, 0); ctx.fill();
  ctx.restore();
}
function roundRectAt(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- boss render ---------- */
function drawBoss(dt) {
  drawWater('#123350', '#020d1c', '#3c4257', H * 0.84);
  drawAmbients(dt, 0.25);
  var b = boss;
  // arena shake on impact
  var shake = b.proj && b.proj.z < 0.15 ? 4 : 0;
  ctx.save(); ctx.translate(rnd(-shake, shake), rnd(-shake, shake));

  // shark king
  var kx = W / 2 + Math.sin(sceneT * 0.8) * W * 0.08, ky = H * 0.24;
  drawShark(kx, ky, 1.9, { teeth: true, flip: Math.sin(sceneT * 0.8) < 0 });
  // crown
  ctx.fillStyle = '#ffd75e';
  ctx.save(); ctx.translate(kx + (Math.sin(sceneT * .8) < 0 ? -1 : 1) * 60, ky - 66);
  ctx.beginPath();
  ctx.moveTo(-22, 12); ctx.lineTo(-22, -8); ctx.lineTo(-10, 2); ctx.lineTo(0, -14); ctx.lineTo(10, 2); ctx.lineTo(22, -8); ctx.lineTo(22, 12);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // telegraph target cell
  if (b.target) {
    var tp = proj(b.target.lane, b.target.depth, 0);
    ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(sceneT * 16) * 0.25;
    ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(tp.x, tp.y, 46, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // projectile
  if (b.proj) {
    var z = b.proj.z * 16;
    var pp = proj(b.proj.lane, b.proj.depth, z);
    var ppx = lerp(pp.x, kx, b.proj.z * 0.6), ppy = lerp(pp.y, ky + 30, b.proj.z * 0.8);
    if (b.proj.kind === 'urchin') drawUrchin(ppx, ppy, pp.s * 1.2, sceneT * 3);
    else if (b.proj.kind === 'ink') {
      ctx.fillStyle = 'rgba(30,20,50,.9)';
      ctx.beginPath(); ctx.arc(ppx, ppy, 26 * pp.s, 0, TAU); ctx.fill();
    } else {
      ctx.save(); ctx.translate(ppx, ppy); ctx.rotate(sceneT * 6);
      ctx.strokeStyle = '#e9e2ce'; ctx.lineWidth = 9 * pp.s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-20 * pp.s, 0); ctx.lineTo(20 * pp.s, 0); ctx.stroke();
      ctx.fillStyle = '#e9e2ce';
      [[-20, -6], [-20, 6], [20, -6], [20, 6]].forEach(function (q) {
        ctx.beginPath(); ctx.arc(q[0] * pp.s, q[1] * pp.s, 6 * pp.s, 0, TAU); ctx.fill();
      });
      ctx.restore();
    }
  }

  // player (goalkeeper)
  var gp = proj(b.vLane, 0, 0);
  var gy = lerp(DEPTH_YS[0], DEPTH_YS[2], b.vDepth / 2) * H;
  drawSwimmer(gp.x, gy, 1, 'free', sceneT * 5, selectedChar, {});
  ctx.restore();

  // HUD: throws + dodges + bonus
  chip(12, 12, 'SHARK KING  ' + b.throws + '/' + b.maxThrows, 'rgba(60,8,20,.6)');
  chip(12, 48, 'BONUS −' + (b.dodged * 0.8).toFixed(1) + 's', 'rgba(4,40,26,.6)');
  ctx.font = '800 ' + Math.min(34, W * 0.07) + 'px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center'; ctx.fillStyle = '#eaf7ff';
  ctx.fillText(fmtTime((race.elapsed - race.bonus) * 1000), W / 2, 18);
  if (race.bannerT > 0) { race.bannerT -= dt; banner(race.banner, clamp(race.bannerT, 0, 1), '#ff8f6b'); }
  drawParts();
}

/* ---------- sprint render ---------- */
function drawSprint(dt) {
  drawWater('#41c4e8', '#0e6f9e', '#ecd9a0', H * 0.84);
  drawAmbients(dt, 0.4);
  var s = sprint;
  var isl = clamp((race.prog / race.total - 0.82) / 0.18, 0, 1);
  drawIsland(W / 2, H * 0.32, 0.5 + isl * 2.2);

  // chasing sharks behind player (bottom, growing when gap small)
  var closeness = clamp(1 - s.sharkGap / 7, 0, 1);
  for (var i = 0; i < 3; i++) {
    var sx = W / 2 + (i - 1) * W * 0.24 + Math.sin(sceneT * 3 + i) * 10;
    var sy = H * (0.98 + 0.1 * (1 - closeness)) + i * 14;
    drawShark(sx, sy, 0.9 + closeness * 0.9, { teeth: closeness > 0.5 });
  }
  // player
  var pp = proj(1, 0, 0);
  drawSwimmer(pp.x, H * 0.6, 1, race.stroke, sceneT * 9, selectedChar, {});
  drawParts();

  // urgency vignette
  ctx.fillStyle = 'rgba(255,40,40,' + closeness * 0.28 + ')';
  ctx.fillRect(0, 0, W, H);

  // HUD + TAP hint
  drawHUD();
  ctx.font = '900 ' + Math.min(38, W * 0.08) + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.75 + Math.sin(sceneT * 12) * 0.25;
  ctx.fillText('TAP! TAP! TAP!', W / 2, H * 0.42);
  ctx.globalAlpha = 1;
  if (race.bannerT > 0) { race.bannerT -= dt; banner(race.banner, clamp(race.bannerT, 0, 1)); }
}

/* ---------- title / select / brief ---------- */
function drawTitle() {
  drawWater('#2f9fd8', '#0b4d7a', '#d8c58f', H * 0.86);
  drawAmbients(0.016, 0.6);
  drawIsland(W * 0.78, H * 0.3, 1);
  drawShark(W * 0.3 + Math.sin(sceneT) * 20, H * 0.62, 1.4, { teeth: true, flip: true });
  if (Math.random() < 0.1) bubble(rnd(0, W), H, { a: .4 });
  drawParts(); updParts(0.016);

  ctx.textAlign = 'center';
  ctx.font = '900 ' + Math.min(52, W * 0.1) + 'px system-ui,sans-serif';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(3,30,46,.9)'; ctx.textBaseline = 'middle';
  ctx.strokeText('SHARKS IN', W / 2, H * 0.2);
  ctx.strokeText('THE WATER!', W / 2, H * 0.3);
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('SHARKS IN', W / 2, H * 0.2);
  ctx.fillText('THE WATER!', W / 2, H * 0.3);
  var sub = CFG.distance + (CFG.courseUnit === 'y' ? ' yd ' : ' m ') + STROKE_NAME[CFG.stroke] + ' — race to the treasure island!';
  fitText(sub, '700', 16, W * 0.92); ctx.fillStyle = '#d9f1ff';
  ctx.fillText(sub, W / 2, H * 0.4);
  ctx.globalAlpha = 0.7 + Math.sin(sceneT * 4) * 0.3;
  ctx.font = '800 20px system-ui,sans-serif'; ctx.fillStyle = '#8affc1';
  ctx.fillText('TAP TO START', W / 2, H * 0.86);
  ctx.globalAlpha = 1;
}
function drawSelect() {
  drawWater('#25709c', '#0a3050', null, null);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.min(26, W * 0.055) + 'px system-ui,sans-serif';
  ctx.fillStyle = '#eaf7ff';
  ctx.fillText('CHOOSE YOUR SWIMMER', W / 2, H * 0.08);

  var g = selectGrid();
  for (var i = 0; i < CHARACTERS.length; i++) {
    var ch = CHARACTERS[i];
    var col = i % g.cols, row = (i / g.cols) | 0;
    var x = g.pad + col * (g.cw + g.pad), y = g.topY + row * (g.ch + g.pad);
    var sel = selectedChar === ch;
    roundRect(x, y, g.cw, g.ch, 14);
    ctx.fillStyle = sel ? 'rgba(90,200,255,.28)' : 'rgba(230,245,255,.09)'; ctx.fill();
    if (sel) { ctx.strokeStyle = '#5fd6ff'; ctx.lineWidth = 3; roundRect(x, y, g.cw, g.ch, 14); ctx.stroke(); }
    // avatar
    var ax = x + g.cw / 2, ay = y + g.ch * 0.34, ar = Math.min(g.cw, g.ch) * 0.2;
    ctx.fillStyle = ch.skin; ctx.beginPath(); ctx.arc(ax, ay, ar, 0, TAU); ctx.fill();
    ctx.fillStyle = ch.cap; ctx.beginPath(); ctx.arc(ax, ay - ar * 0.12, ar * 0.97, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#183048'; ctx.lineWidth = Math.max(2, ar * 0.16);
    ctx.beginPath(); ctx.moveTo(ax - ar * 0.9, ay - ar * 0.05); ctx.lineTo(ax + ar * 0.9, ay - ar * 0.05); ctx.stroke();
    ctx.fillStyle = '#183048';
    ctx.beginPath(); ctx.ellipse(ax - ar * 0.35, ay + ar * 0.1, ar * 0.22, ar * 0.16, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ax + ar * 0.35, ay + ar * 0.1, ar * 0.22, ar * 0.16, 0, 0, TAU); ctx.fill();
    // texts
    ctx.font = '800 ' + Math.max(11, Math.min(15, g.cw * 0.09)) + 'px system-ui,sans-serif';
    ctx.fillStyle = '#eaf7ff';
    ctx.fillText(ch.name, x + g.cw / 2, y + g.ch * 0.66);
    ctx.font = '700 ' + Math.max(10, Math.min(13, g.cw * 0.08)) + 'px system-ui,sans-serif';
    ctx.fillStyle = '#9fd2ef';
    ctx.fillText(ch.flag + ' ' + ch.country + ' · ' + (ch.gender === 'M' ? '♂' : '♀'), x + g.cw / 2, y + g.ch * 0.8);
    ctx.fillStyle = '#7fb8d8'; ctx.font = 'italic 600 ' + Math.max(9, Math.min(12, g.cw * 0.07)) + 'px system-ui,sans-serif';
    ctx.fillText(ch.trait, x + g.cw / 2, y + g.ch * 0.92);
  }
  if (selectedChar) bigButton(W / 2 - 130, H - 76, 260, 'DIVE IN  ▶', true);
  else {
    ctx.font = '700 15px system-ui,sans-serif'; ctx.fillStyle = '#9fd2ef';
    ctx.fillText('Tap a swimmer to select', W / 2, H - 50);
  }
}
function drawBrief() {
  drawWater('#2f9fd8', '#0b4d7a', '#d8c58f', H * 0.86);
  drawAmbients(0.016, 0.5); updParts(0.016); drawParts();
  drawIsland(W * 0.5, H * 0.28, 1.4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var lines = [
    'Whoah… look at that treasure!',
    'Swim ' + CFG.distance + (CFG.courseUnit === 'y' ? ' yards' : ' meters') + ' of ' + STROKE_NAME[CFG.stroke] + ' to the island!',
    '',
    '🌊  Swipe ⟵ ⟶ ↑ ↓ to dodge sea creatures',
    '🪸  Only ONE coral arch is open — watch for tentacles!',
    '🦈  Sharks look blurry far away… when the alarm sounds,',
    'HOLD 1 second to climb on a rock!',
    '💰  Grab 12+ coins to challenge the SHARK KING (time bonus!)'
  ];
  ctx.font = '800 ' + Math.min(22, W * 0.045) + 'px system-ui,sans-serif';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText(lines[0], W / 2, H * 0.46);
  ctx.fillStyle = '#eaf7ff';
  for (var i = 1; i < lines.length; i++) {
    fitText(lines[i], '700', Math.min(16, W * 0.036), W * 0.94);
    ctx.fillText(lines[i], W / 2, H * 0.46 + 34 + i * 26);
  }
  ctx.globalAlpha = 0.7 + Math.sin(sceneT * 4) * 0.3;
  ctx.font = '800 20px system-ui,sans-serif'; ctx.fillStyle = '#8affc1';
  ctx.fillText("LET'S GO — TAP!", W / 2, H * 0.92);
  ctx.globalAlpha = 1;
}

/* ---------- finish / gameover / results ---------- */
function drawFinish() {
  drawWater('#41c4e8', '#0e6f9e', '#ecd9a0', H * 0.8);
  var t = clamp(sceneT / 1.2, 0, 1);
  drawIsland(W / 2, H * 0.42, 1.6 + t);
  // treasure burst
  if (Math.random() < 0.4) sparkle(W / 2 + rnd(-120, 120), H * 0.45 + rnd(-30, 30), pick(['#ffd75e', '#7ef3ff', '#ff9de2']));
  updParts(0.016); drawParts();
  drawStanding(W / 2 - 60, H * 0.42, 1.1, selectedChar);
  banner('WE MADE IT!', 1, '#ffd75e');
  ctx.font = '800 26px ui-monospace,Menlo,monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#eaf7ff';
  ctx.fillText(fmtTime(results.timeMs), W / 2, H * 0.62);
}
function drawGameover() {
  drawWater('#571f2b', '#160309', null, null);
  drawShark(W / 2, H * 0.3 + Math.sin(sceneT * 2) * 8, 2.2, { teeth: true });
  banner(gameoverInfo.by === 'shark' ? 'SHARK GOT YOU!' : 'WIPEOUT!', 1, '#ff6b5e');
  ctx.textAlign = 'center';
  ctx.font = '700 16px system-ui,sans-serif'; ctx.fillStyle = '#f3c9c9';
  ctx.fillText('Coins collected: ' + gameoverInfo.coins + '  ·  ' + fmtTime(gameoverInfo.timeMs), W / 2, H * 0.52);
  if (sceneT > 0.7) {
    bigButton(24, H - 90, W / 2 - 36, 'TRY AGAIN', true);
    bigButton(W / 2 + 12, H - 90, W / 2 - 36, 'EXIT', false);
  }
}
function drawResults() {
  drawWater('#25709c', '#0a3050', null, null);
  drawAmbients(0.016, 0.3);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.min(30, W * 0.06) + 'px system-ui,sans-serif';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('🏆 TREASURE CLAIMED!', W / 2, H * 0.09);

  ctx.font = '800 ' + Math.min(46, W * 0.11) + 'px ui-monospace,Menlo,monospace';
  ctx.fillStyle = '#eaf7ff';
  ctx.fillText(fmtTime(results.timeMs), W / 2, H * 0.19);
  ctx.font = '700 14px system-ui,sans-serif'; ctx.fillStyle = '#9fd2ef';
  ctx.fillText(CFG.distance + (CFG.courseUnit === 'y' ? 'yd' : 'm') + ' ' + STROKE_NAME[CFG.stroke]
    + '  ·  💰 ' + results.coins + '  ·  boss bonus −' + results.bonus.toFixed(1) + 's', W / 2, H * 0.25);

  if (serverBoard) {
    var me = serverBoard.me;
    if (me) {
      // badge medallion
      var bx = W / 2, by = H * 0.36, br = 40;
      ctx.fillStyle = badgeColor(me.badge);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bx, by, br - 4, 0, TAU); ctx.stroke();
      ctx.font = '900 ' + (me.badge.length > 2 ? 20 : 26) + 'px system-ui,sans-serif';
      ctx.fillStyle = '#08283c'; ctx.fillText(me.badge, bx, by + 1);
      ctx.font = '700 15px system-ui,sans-serif'; ctx.fillStyle = '#eaf7ff';
      ctx.fillText('Rank #' + me.rank + ' of ' + me.total + '  ·  top ' + me.percentile.toFixed(1) + '%', W / 2, by + br + 22);
    }
    var items = serverBoard.items || [];
    var ly = H * 0.5;
    ctx.font = '800 14px system-ui,sans-serif'; ctx.fillStyle = '#9fd2ef';
    ctx.fillText('— LEADERBOARD —', W / 2, ly - 12);
    ctx.font = '700 14px ui-monospace,Menlo,monospace';
    for (var i = 0; i < Math.min(8, items.length); i++) {
      var it = items[i], mine = me && it.rank === me.rank && it.timeMs === me.timeMs;
      ctx.fillStyle = mine ? '#ffd75e' : '#d9ecf7';
      var nm = (it.displayName || 'Swimmer').slice(0, 14);
      ctx.textAlign = 'left';
      ctx.fillText('#' + it.rank + '  ' + nm, W * 0.14, ly + 10 + i * 22);
      ctx.textAlign = 'right';
      ctx.fillText(fmtTime(it.timeMs) + '  ' + it.badge, W * 0.86, ly + 10 + i * 22);
    }
    ctx.textAlign = 'center';
  } else {
    ctx.font = '700 14px system-ui,sans-serif'; ctx.fillStyle = '#7fa8c8';
    ctx.fillText(window.ReactNativeWebView ? 'Sign in to the AI Coach account to join the leaderboard!' : 'Leaderboard available in the app', W / 2, H * 0.42);
    // local badge tease
    ctx.font = '700 15px system-ui,sans-serif'; ctx.fillStyle = '#9fd2ef';
    ctx.fillText('Great swim, ' + (selectedChar ? selectedChar.name : 'champ') + '! ' + (selectedChar ? selectedChar.flag : ''), W / 2, H * 0.5);
  }
  bigButton(24, H - 90, W / 2 - 36, 'RACE AGAIN', true);
  bigButton(W / 2 + 12, H - 90, W / 2 - 36, 'EXIT', false);
}
function badgeColor(b) {
  return { AAAA: '#ffd75e', AAA: '#e8e8ef', AA: '#e2a55f', A: '#7ef3ff', BB: '#8affc1', B: '#b9c7d8' }[b] || '#b9c7d8';
}

/* ---------- host → game bridge ---------- */
window.postResult = function (data) {
  try { serverBoard = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) {}
};

/* 테스트/자동화 훅 (읽기 전용) — playwright 스모크가 사용 */
window.__debug = {
  get scene() { return scene; },
  get race() { return race; },
  get boss() { return boss; },
  get sprint() { return sprint; },
  get results() { return results; },
  blockedCells: blockedCells
};

setScene('title');
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
